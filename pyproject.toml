[project]
name = "incremental-data-pipeline"
version = "0.1.0"
description = "Replayable workflow event ingestion with analytical state and quarantine"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
